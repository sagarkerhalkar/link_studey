name: Browser and Device Smoke Tests

on:
  push:
  pull_request:

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start fake Shlink
        run: python scripts/fake_shlink_server.py > fake-shlink.log 2>&1 &
      - name: Create administrator
        env:
          DATABASE_URL: sqlite:///instance/browser-ci.db
          SHLINK_API_URL: http://127.0.0.1:8080
          SHLINK_API_KEY: browser-ci-key
          TRUST_PROXY: "0"
        run: flask --app run.py create-admin --username admin --display-name "CI Admin" --password "AdminPassword123!"
      - name: Start dashboard
        env:
          DATABASE_URL: sqlite:///instance/browser-ci.db
          SHLINK_API_URL: http://127.0.0.1:8080
          SHLINK_API_KEY: browser-ci-key
          TRUST_PROXY: "0"
        run: waitress-serve --host=127.0.0.1 --port=2331 --call link_analytics:create_app > dashboard.log 2>&1 &
      - name: Wait for services
        run: |
          for i in {1..40}; do curl -fsS http://127.0.0.1:2331/healthz && exit 0; sleep 1; done
          cat dashboard.log
          exit 1
      - name: Run visual and interaction smoke tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            test-results/
            dashboard.log
            fake-shlink.log
