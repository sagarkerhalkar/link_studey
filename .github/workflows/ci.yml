name: Link Analytics CI

"on":
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Dependency integrity
        run: pip check
      - name: Compile Python
        run: python -m compileall -q link_analytics tests scripts run.py
      - name: Ruff
        run: ruff check .
      - name: Unit and integration tests
        run: |
          mkdir -p test-results
          pytest -q --cov=link_analytics --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml \
            --junitxml=test-results/junit.xml
      - name: Install Chromium for browser acceptance
        run: python -m playwright install --with-deps chromium
      - name: Real-browser acceptance
        env:
          PYTHONPATH: .
          RESET_DEMO: '1'
          BASE_URL: http://127.0.0.1:24131
          BROWSER_EXECUTABLE: ''
        run: |
          python scripts/demo_server.py > test-results/demo-server.log 2>&1 &
          echo $! > test-results/demo-server.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:24131/healthz && break
            sleep 1
          done
          python scripts/browser_acceptance_v4.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-analytics-test-results
          path: test-results
